<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>English Vocabulary Flashcards</title>

<style>

/* =========================================================
   FONT
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');


/* =========================================================
   GLOBAL
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', Arial, sans-serif;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100dvh;

  background:
    linear-gradient(
      135deg,
      #667eea 0%,
      #764ba2 100%
    );

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 6px;

  color: #1e293b;

  transition:
    background 0.3s ease;
}


/* =========================================================
   THEMES
========================================================= */

body.theme-blue {
  background:
    linear-gradient(
      135deg,
      #667eea 0%,
      #764ba2 100%
    );
}

body.theme-ocean {
  background:
    linear-gradient(
      135deg,
      #0891b2 0%,
      #2563eb 100%
    );
}

body.theme-sunset {
  background:
    linear-gradient(
      135deg,
      #f97316 0%,
      #db2777 100%
    );
}

body.theme-green {
  background:
    linear-gradient(
      135deg,
      #10b981 0%,
      #047857 100%
    );
}

body.theme-dark {
  background:
    linear-gradient(
      135deg,
      #111827 0%,
      #312e81 100%
    );
}


/* =========================================================
   APP
========================================================= */

.app {
  width: min(94vw, 430px);

  height: min(97dvh, 760px);

  display: flex;
  flex-direction: column;

  gap: 5px;

  position: relative;
}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar {
  width: 100%;

  min-height: 30px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  flex-shrink: 0;
}

.app-title {
  color: white;

  font-size: 14px;

  font-weight: 800;

  letter-spacing: .3px;
}


.theme-toggle {
  width: 32px;
  height: 32px;

  border: none;
  border-radius: 50%;

  background:
    rgba(255,255,255,.20);

  color: white;

  font-size: 16px;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  backdrop-filter: blur(8px);

  box-shadow:
    0 4px 10px
    rgba(0,0,0,.12);
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 5px;

  flex-shrink: 0;
}

.controls button,
.controls select {
  border: none;
  border-radius: 9px;

  padding: 6px 9px;

  font-size: 10px;
  font-weight: 700;

  cursor: pointer;
}

.controls button {
  background: white;
  color: #4c1d95;

  box-shadow:
    0 3px 8px
    rgba(0,0,0,.10);
}

.controls button.secondary {
  background:
    rgba(255,255,255,.25);

  color: white;

  border:
    1px solid
    rgba(255,255,255,.20);
}

.controls select {
  background: white;
  color: #334155;
}


/* =========================================================
   STATUS
========================================================= */

.status {
  text-align: center;

  color:
    rgba(255,255,255,.88);

  font-size: 9px;

  height: 12px;
  line-height: 12px;

  flex-shrink: 0;
}


/* =========================================================
   CARD CONTAINER
========================================================= */

#cardContainer {
  width: 100%;

  flex: 1;

  min-height: 0;

  display: flex;
}


/* =========================================================
   MAIN CARD
========================================================= */

.card {
  width: 100%;
  height: 100%;

  background: #ffffff;

  border-radius: 24px;

  padding: 10px;

  box-shadow:
    0 20px 45px
    rgba(0,0,0,.22);

  display: flex;
  flex-direction: column;

  overflow: hidden;

  position: relative;

  animation:
    cardAppear .25s ease;
}

@keyframes cardAppear {
  from {
    opacity: 0;
    transform: scale(.985);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}


/* =========================================================
   CARD NUMBER
   Tiny / no extra space
========================================================= */

.card-number {
  position: absolute;

  top: 6px;
  right: 10px;

  font-size: 8px;

  color:
    rgba(100,116,139,.60);

  font-weight: 700;

  z-index: 10;
}


/* =========================================================
   FRONT
========================================================= */

.front-side {
  flex: 1;

  min-height: 0;

  display: flex;
  flex-direction: column;

  gap: 7px;
}


/* =========================================================
   ENGLISH VOCABULARY
========================================================= */

.front-title {
  text-align: center;

  color: #4c1d95;

  font-size: 16px;

  font-weight: 800;

  padding: 2px 0;

  flex-shrink: 0;
}


/* =========================================================
   KEY DIFFERENCE HEADER
========================================================= */

.key-header {
  background:
    linear-gradient(
      135deg,
      #ff9a9e 0%,
      #fecfef 100%
    );

  border-radius: 14px;

  padding: 8px;

  text-align: center;

  box-shadow:
    0 4px 12px
    rgba(255,154,158,.30);

  flex-shrink: 0;
}

.key-header span {
  color: #721c24;

  font-size: 12px;

  font-weight: 800;

  text-transform: uppercase;

  letter-spacing: .7px;
}


/* =========================================================
   FRONT WORDS
========================================================= */

.front-word {
  flex: 1;

  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  background: #f8fafc;

  border:
    2px solid
    #e2e8f0;

  border-radius: 18px;

  padding: 10px;

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.04);
}

.front-word.second {
  background: #f0f9ff;

  border-color: #bae6fd;
}

.front-word-text {
  font-size:
    clamp(
      32px,
      9vw,
      46px
    );

  line-height: 1.05;

  font-weight: 800;

  color: #1e293b;

  word-break: break-word;
}


/* =========================================================
   FRONT HINT
========================================================= */

.front-hint {
  text-align: center;

  color: #94a3b8;

  font-size: 9px;

  font-weight: 600;

  padding: 2px 0;

  flex-shrink: 0;
}


/* =========================================================
   LEARNED BUTTON
========================================================= */

.front-action {
  display: flex;
  justify-content: center;

  flex-shrink: 0;
}

.learned-btn {
  border: none;

  border-radius: 10px;

  background:
    #16a34a;

  color: white;

  padding:
    8px 20px;

  font-size: 11px;

  font-weight: 800;

  cursor: pointer;

  box-shadow:
    0 4px 10px
    rgba(22,163,74,.20);
}


/* =========================================================
   DETAILS
========================================================= */

.details-side {
  flex: 1;

  min-height: 0;

  display: flex;
  flex-direction: column;

  gap: 6px;

  overflow: hidden;
}


/* =========================================================
   DETAILS TITLE
========================================================= */

.details-title {
  text-align: center;

  color: #4c1d95;

  font-size: 14px;

  font-weight: 800;

  flex-shrink: 0;
}


/* =========================================================
   KEY DIFFERENCE
========================================================= */

.difference-box {
  background:
    #fff8e6;

  border-left:
    5px solid
    #f59e0b;

  border-radius:
    11px;

  padding:
    8px 10px;

  flex-shrink: 0;

  max-height: 88px;

  overflow: hidden;
}

.difference-label {
  color: #b45309;

  font-size: 11px;

  font-weight: 800;

  letter-spacing: .5px;

  margin-bottom: 3px;
}

.difference-text {
  color: #451a03;

  font-size: 15px;

  font-weight: 700;

  line-height: 1.3;

  word-break: break-word;
}


/* =========================================================
   DETAIL WORD CARD
========================================================= */

.detail-word {
  flex: 1;

  min-height: 0;

  background:
    #f8fafc;

  border:
    2px solid
    #e2e8f0;

  border-radius:
    15px;

  padding:
    8px 10px;

  display:
    flex;

  flex-direction:
    column;

  gap:
    6px;

  overflow:
    hidden;
}

.detail-word.second {
  background:
    #f0f9ff;

  border-color:
    #bae6fd;
}


/* =========================================================
   ROW 1 = WORD + SYN
========================================================= */

.detail-header {
  width: 100%;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 8px;

  min-width: 0;

  flex-shrink: 0;
}

.detail-word-name {
  font-size: 24px;

  font-weight: 800;

  line-height: 1.05;

  color: #1e293b;

  min-width: 0;

  flex: 1;

  word-break: break-word;
}

.syn-line {
  flex-shrink: 0;

  max-width: 58%;
}


/* =========================================================
   ROW 2 = MEANING + ANT
========================================================= */

.meaning-row {
  width: 100%;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 8px;

  min-width: 0;

  flex-shrink: 0;
}


/* =========================================================
   SYN / ANT
========================================================= */

.badge {
  display: inline-block;

  padding:
    5px 9px;

  border-radius:
    50px;

  font-size:
    17px;

  font-weight:
    800;

  line-height:
    1.12;

  white-space:
    normal;

  word-break:
    break-word;

  overflow:
    visible;

  max-width:
    100%;

  text-align:
    center;
}

.badge-syn {
  background:
    #d1fae5;

  color:
    #065f46;
}

.badge-ant {
  background:
    #ffe4e6;

  color:
    #9f1239;

  flex-shrink: 0;

  max-width: 45%;
}


/* =========================================================
   MEANING
   Larger box
========================================================= */

.info-text {
  flex: 1;

  min-width: 0;

  min-height: 58px;

  display: flex;

  align-items: center;

  background:
    #fff8e6;

  border-radius:
    11px;

  padding:
    10px 12px;

  font-size:
    22px;

  font-weight:
    800;

  line-height:
    1.25;

  color:
    #451a03;

  word-break:
    break-word;
}

.detail-word.second
.info-text {
  background:
    #f0fdf4;

  color:
    #052e16;
}


/* =========================================================
   EXAMPLE
   Smaller box, larger text
========================================================= */

.sentence-text {
  width: 100%;

  background:
    #ffffff;

  border:
    1px dashed
    #cbd5e1;

  border-radius:
    8px;

  padding:
    5px 8px;

  min-height:
    34px;

  max-height:
    50px;

  font-size:
    18px;

  font-weight:
    700;

  line-height:
    1.22;

  color:
    #334155;

  font-style:
    italic;

  word-break:
    break-word;

  overflow:
    hidden;

  flex-shrink: 0;
}


/* =========================================================
   DETAILS ACTIONS
========================================================= */

.details-actions {
  display: flex;

  justify-content:
    center;

  gap:
    6px;

  flex-shrink: 0;
}

.details-actions button {
  border:
    none;

  border-radius:
    9px;

  padding:
    7px 11px;

  color:
    white;

  font-size:
    10px;

  font-weight:
    800;

  cursor:
    pointer;
}

.btn-learning {
  background:
    #d97706;
}

.btn-mastered {
  background:
    #16a34a;
}


/* =========================================================
   LOADING / EMPTY
========================================================= */

.loading,
.empty {
  width: 100%;
  height: 100%;

  background:
    white;

  border-radius:
    24px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  flex-direction:
    column;

  text-align:
    center;

  padding:
    20px;

  box-shadow:
    0 20px 40px
    rgba(0,0,0,.18);
}

.empty h2 {
  color:
    #1e293b;

  font-size:
    18px;

  margin-bottom:
    7px;
}

.empty p {
  color:
    #64748b;

  font-size:
    12px;

  line-height:
    1.5;

  margin-bottom:
    12px;
}

.empty button {
  border:
    none;

  border-radius:
    9px;

  padding:
    8px 14px;

  background:
    #4c1d95;

  color:
    white;

  cursor:
    pointer;
}

   MOBILE

  }

  .detail-word-name {

  }

  .badge {

    padding:
      4px 7px;

  .info-text {

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 601px) {

  .app {
    width:
      390px;

    height:
      min(94vh, 700px);
  }

   DARK THEME
========================================================= */

    #111827;
}

body.theme-dark .front-word.second,
body.theme-dark .detail-word.second {

}

    #422006;

    #fef3c7;
}

.detail-word.second
.info-text {

  color:

<body>


<div class="app">


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <div class="top-bar">

    <div class="app-title">
      English Vocabulary
    </div>


    <button
      class="theme-toggle"
      id="themeToggle"
      onclick="toggleTheme()"
      title="Change theme">

      🎨

    </button>

  </div>


  <!-- =====================================================
       CONTROLS
  ====================================================== -->

  <div class="controls">

    <button
      onclick="setMode('learning')">

      Learning

    </button>


    <button
      class="secondary"
      onclick="setMode('revision')">

      Revision

    </button>


    <select
      id="cardCount"
      onchange="loadCards()">

      <option value="10">
        10 Cards
      </option>

      <option value="20">
        20 Cards
      </option>

      <option value="30">
        30 Cards
      </option>

      <option value="40">
        40 Cards
      </option>

      <option value="50">
        50 Cards
      </option>

    </select>

  </div>


  <!-- =====================================================
       STATUS
  ====================================================== -->

  <div
    id="status"
    class="status">

    Loading...

  </div>


  <!-- =====================================================
       CARD
  ====================================================== -->

  <div
    id="cardContainer">

  </div>


</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT WEB APP URL
========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwrd05bPS6U1pPJ8H6jqp-XxgsS6QbHbU9V2PdXOrdsE_TPsuntlQbCxMYfyTnfi-k6/exec";


/* =========================================================
   VARIABLES
========================================================= */

let cards = [];

let currentIndex = 0;

let currentMode = "learning";

let showingDetails = false;

let touchStartX = 0;

let touchStartY = 0;


/* =========================================================
   THEMES
========================================================= */

const themeList = [
  "theme-blue",
  "theme-ocean",
  "theme-sunset",
  "theme-green",
  "theme-dark"
];

let currentTheme = 0;


function loadSavedTheme() {

  const saved =
    localStorage.getItem(
      "vocabTheme"
    );


  if (!saved) {

    document.body.classList.add(
      "theme-blue"
    );

    return;

  }


  const savedIndex =
    themeList.indexOf(
      saved
    );


  if (savedIndex >= 0) {

    currentTheme =
      savedIndex;

    document.body.classList.add(
      saved
    );

  }

  else {

    document.body.classList.add(
      "theme-blue"
    );

  }

}


function toggleTheme() {

  document.body.classList.remove(
    ...themeList
  );


  currentTheme++;

  if (
    currentTheme >=
    themeList.length
  ) {

    currentTheme = 0;

  }


  document.body.classList.add(
    themeList[currentTheme]
  );


  localStorage.setItem(
    "vocabTheme",
    themeList[currentTheme]
  );

}


/* =========================================================
   START
========================================================= */

window.addEventListener(
  "load",
  function() {

    loadSavedTheme();

    loadCards();

  }
);


/* =========================================================
   MODE
========================================================= */

function setMode(mode) {

  currentMode =
    mode;

  currentIndex =
    0;

  showingDetails =
    false;

  loadCards();

}


/* =========================================================
   LOAD CARDS
========================================================= */

async function loadCards() {

  const container =
    document.getElementById(
      "cardContainer"
    );


  const status =
    document.getElementById(
      "status"
    );


  const count =
    Number(
      document.getElementById(
        "cardCount"
      ).value
    );


  showingDetails =
    false;


  container.innerHTML = `
    <div class="loading">
      Loading cards...
    </div>
  `;


  status.textContent =
    "Loading " +
    currentMode +
    " cards...";


  if (
    API_URL ===
    "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"
  ) {

    container.innerHTML = `

      <div class="empty">

        <h2>
          API URL Required
        </h2>

        <p>
          Please put your deployed Google Apps Script
          Web App URL into API_URL.
        </p>

      </div>

    `;

    status.textContent =
      "";

    return;

  }


  try {

    const url =
      API_URL +
      "?action=cards" +
      "&mode=" +
      encodeURIComponent(
        currentMode
      ) +
      "&limit=" +
      count;


    const response =
      await fetch(
        url,
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP error: " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Unable to fetch cards."
      );

    }


    cards =
      Array.isArray(
        data.cards
      )
      ? data.cards
      : [];


    currentIndex =
      0;

    showingDetails =
      false;


    status.textContent =
      cards.length +
      " cards loaded";


    renderCard();

  }

  catch (error) {

    console.error(
      error
    );


    container.innerHTML = `

      <div class="empty">

        <h2>
          Error
        </h2>

        <p>
          ${escapeHtml(
            error.message
          )}
        </p>

        <button
          onclick="loadCards()">

          Try Again

        </button>

      </div>

    `;


    status.textContent =
      "Could not load cards.";

  }

}


/* =========================================================
   RENDER CARD
========================================================= */

function renderCard() {

  const container =
    document.getElementById(
      "cardContainer"
    );


  if (
    !cards ||
    cards.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        <h2>
          No Cards Found
        </h2>

        <p>
          There are no complete vocabulary cards
          available in this mode.
        </p>

      </div>

    `;

    return;

  }


  if (
    currentIndex < 0
  ) {

    currentIndex =
      0;

  }


  if (
    currentIndex >=
    cards.length
  ) {

    currentIndex =
      cards.length - 1;

  }


  const card =
    cards[currentIndex];


  /* =======================================================
     FRONT
  ======================================================= */

  if (!showingDetails) {

    container.innerHTML = `

      <div
        class="card"
        id="flashCard">


        <div class="card-number">

          ${currentIndex + 1}/${cards.length}

        </div>


        <div class="front-side">


          <div class="front-title">

            English Vocabulary

          </div>


          <div class="key-header">

            <span>
              KEY DIFFERENCE
            </span>

          </div>


          <!-- WORD 1 -->

          <div class="front-word">

            <div class="front-word-text">

              ${escapeHtml(
                card.w1.name
              )}

            </div>

          </div>


          <!-- WORD 2 -->

          <div class="front-word second">

            <div class="front-word-text">

              ${escapeHtml(
                card.w2.name
              )}

            </div>

          </div>


          <div class="front-hint">

            👉 Swipe right for details

          </div>


          <div class="front-action">

            <button
              class="learned-btn"
              onclick="moveCurrentFromFront()">

              ${
                currentMode === "learning"
                ? "✓ LEARNED"
                : "✓ MASTERED"
              }

            </button>

          </div>


        </div>

      </div>

    `;


    enableSwipe();

    return;

  }


  /* =======================================================
     DETAILS
  ======================================================= */

  container.innerHTML = `

    <div
      class="card"
      id="flashCard">


      <div class="card-number">

        ${currentIndex + 1}/${cards.length}

      </div>


      <div class="details-side">


        <div class="details-title">

          English Vocabulary

        </div>


        <!-- KEY DIFFERENCE -->

        <div class="difference-box">

          <div class="difference-label">

            KEY DIFFERENCE

          </div>

          <div class="difference-text">

            ${escapeHtml(
              card.diff
            )}

          </div>

        </div>


        <!-- =================================================
             WORD 1
             Row 1 = Word + SYN
             Row 2 = Meaning + ANT
             Row 3 = Example
        ================================================== -->

        <div class="detail-word">


          <!-- WORD + SYN -->

          <div class="detail-header">

            <div class="detail-word-name">

              ${escapeHtml(
                card.w1.name
              )}

            </div>


            <div class="syn-line">

              <span class="badge badge-syn">

                SYN:
                ${escapeHtml(
                  card.w1.syn
                )}

              </span>

            </div>

          </div>


          <!-- MEANING + ANT -->

          <div class="meaning-row">

            <div class="info-text">

              ${escapeHtml(
                card.w1.mean
              )}

            </div>


            <span class="badge badge-ant">

              ANT:
              ${escapeHtml(
                card.w1.ant
              )}

            </span>

          </div>


          <!-- EXAMPLE -->

          <div class="sentence-text">

            ${escapeHtml(
              card.w1.sent
            )}

          </div>


        </div>


        <!-- =================================================
             WORD 2
        ================================================== -->

        <div class="detail-word second">


          <!-- WORD + SYN -->

          <div class="detail-header">

            <div class="detail-word-name">

              ${escapeHtml(
                card.w2.name
              )}

            </div>


            <div class="syn-line">

              <span class="badge badge-syn">

                SYN:
                ${escapeHtml(
                  card.w2.syn
                )}

              </span>

            </div>

          </div>


          <!-- MEANING + ANT -->

          <div class="meaning-row">

            <div class="info-text">

              ${escapeHtml(
                card.w2.mean
              )}

            </div>


            <span class="badge badge-ant">

              ANT:
              ${escapeHtml(
                card.w2.ant
              )}

            </span>

          </div>


          <!-- EXAMPLE -->

          <div class="sentence-text">

            ${escapeHtml(
              card.w2.sent
            )}

          </div>


        </div>


        <!-- ACTIONS -->

        <div class="details-actions">

          ${
            currentMode === "learning"

            ?

            `

            <button
              class="btn-learning"
              onclick="moveToRevision()">

              ✓ LEARNED

            </button>

            `

            :

            `

            <button
              class="btn-learning"
              onclick="moveToLearning()">

              ↩ LEARNING

            </button>


            <button
              class="btn-mastered"
              onclick="moveToLearned2()">

              ✓ MASTERED

            </button>

            `
          }

        </div>


      </div>


    </div>

  `;


  enableSwipe();

}


/* =========================================================
   MOVE CURRENT FROM FRONT
========================================================= */

function moveCurrentFromFront() {

  if (
    currentMode ===
    "learning"
  ) {

    moveToRevision();

  }

  else {

    moveToLearned2();

  }

}

/* =========================================================
   SWIPE
========================================================= */

function enableSwipe() {

  const card =
    document.getElementById(
      "flashCard"
    );

  if (!card) {
    return;
  }

  let startX = 0;
  let startY = 0;

  card.addEventListener(
    "touchstart",
    function(event) {

      if (
        event.touches.length !== 1
      ) {
        return;
      }

      startX =
        event.touches[0].clientX;

      startY =
        event.touches[0].clientY;

    },
    {
      passive: true
    }
  );


  card.addEventListener(
    "touchend",
    function(event) {

      if (
        event.changedTouches.length !== 1
      ) {
        return;
      }

      const endX =
        event.changedTouches[0].clientX;

      const endY =
        event.changedTouches[0].clientY;

      const dx =
        endX - startX;

      const dy =
        endY - startY;

      const absX =
        Math.abs(dx);

      const absY =
        Math.abs(dy);

      const threshold = 55;


      /* =====================================================
         HORIZONTAL SWIPE
      ===================================================== */

      if (
        absX > absY &&
        absX >= threshold
      ) {

        /*
         * RIGHT = DETAILS
         */

        if (
          dx > 0 &&
          !showingDetails
        ) {

          showingDetails = true;

          renderCard();

          return;

        }


        /*
         * LEFT = MOVE CARD
         */

        if (
          dx < 0
        ) {

          moveCurrentCard();

          return;

        }

      }


      /* =====================================================
         VERTICAL SWIPE
      ===================================================== */

      if (
        absY > absX &&
        absY >= threshold
      ) {

        /*
         * UP = NEXT
         */

        if (
          dy < 0
        ) {

          nextCard();

          return;

        }


        /*
         * DOWN = PREVIOUS
         */

        if (
          dy > 0
        ) {

          previousCard();

          return;

        }

      }

    },
    {
      passive: true
    }
  );

}


/* =========================================================
   MOVE CURRENT CARD
========================================================= */

function moveCurrentCard() {

  if (
    !cards ||
    cards.length === 0
  ) {
    return;
  }

  const card =
    cards[currentIndex];

  if (!card) {
    return;
  }


  /*
   * LEARNING MODE
   *
   * Vocabulary → Learned
   */

  if (
    currentMode === "learning"
  ) {

    moveToRevision();

    return;

  }


  /*
   * REVISION MODE
   *
   * Default left action:
   * Revision → Learned 2
   */

  if (
    currentMode === "revision"
  ) {

    moveToLearned2();

    return;

  }

}






/* =========================================================
   NEXT CARD — CONTINUOUS LOOP
========================================================= */

function nextCard() {

  if (
    !cards ||
    cards.length === 0
  ) {
    return;
  }

  currentIndex =
    (currentIndex + 1) %
    cards.length;

  showingDetails = false;

  renderCard();
}


/* =========================================================
   PREVIOUS CARD — CONTINUOUS LOOP
========================================================= */

function previousCard() {

  if (
    !cards ||
    cards.length === 0
  ) {
    return;
  }

  currentIndex =
    (currentIndex - 1 + cards.length) %
    cards.length;

  showingDetails = false;

  renderCard();
}
/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    const tag =
      document.activeElement.tagName;


    if (
      tag === "INPUT" ||
      tag === "TEXTAREA" ||
      tag === "SELECT"
    ) {
      return;
    }


    /* =====================================================
       RIGHT ARROW = SHOW DETAILS
    ===================================================== */

    if (
      event.key === "ArrowRight"
    ) {

      event.preventDefault();


      if (
        !showingDetails
      ) {

        showingDetails = true;

        renderCard();

      }
      else {

        nextCard();

      }

      return;

    }


    /* =====================================================
       LEFT ARROW = MOVE CARD
    ===================================================== */

    if (
      event.key === "ArrowLeft"
    ) {

      event.preventDefault();

      moveCurrentCard();

      return;

    }


    /* =====================================================
       UP ARROW = NEXT
    ===================================================== */

    if (
      event.key === "ArrowUp"
    ) {

      event.preventDefault();

      nextCard();

      return;

    }


    /* =====================================================
       DOWN ARROW = PREVIOUS
    ===================================================== */

    if (
      event.key === "ArrowDown"
    ) {

      event.preventDefault();

      previousCard();

      return;

    }

  }
);


/* =========================================================
   MOVE TO REVISION
========================================================= */

async function moveToRevision() {

  const card =
    cards[currentIndex];


  if (!card) {
    return;
  }


  await moveCard(
    card.id,
    "revision"
  );

}


/* =========================================================
   MOVE TO LEARNING
========================================================= */

async function moveToLearning() {

  const card =
    cards[currentIndex];


  if (!card) {
    return;
  }


  await moveCard(
    card.id,
    "learning"
  );

}


/* =========================================================
   MOVE TO LEARNED 2
========================================================= */

async function moveToLearned2() {

  const card =
    cards[currentIndex];


  if (!card) {
    return;
  }


  await moveCard(
    card.id,
    "learned2"
  );

}


/* =========================================================
   MOVE CARD
========================================================= */

async function moveCard(
  id,
  destination
) {

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    "Moving card...";


  try {

    const url =
      API_URL +
      "?action=move" +
      "&id=" +
      encodeURIComponent(
        id
      ) +
      "&destination=" +
      encodeURIComponent(
        destination
      );


    const response =
      await fetch(
        url,
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP error: " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Card could not be moved."
      );

    }


    /*
     * Remove current card
     */

    cards.splice(
      currentIndex,
      1
    );


    /*
     * Correct index
     */

    if (
      currentIndex >=
      cards.length
    ) {

      currentIndex =
        cards.length - 1;

    }


    if (
      currentIndex < 0
    ) {

      currentIndex =
        0;

    }


    showingDetails =
      false;


    status.textContent =
      "Card moved successfully.";


    renderCard();

  }

  catch (error) {

    console.error(
      error
    );


    status.textContent =
      "Error: " +
      error.message;

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";
  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
